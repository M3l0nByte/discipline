<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not found — DISCIPLINE</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@400;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root { --lime:#c6f24e; --ember:#ff6a2b; --line:#232833; --muted:#8b93a5; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; text-align:center;
      background: radial-gradient(900px 600px at 80% -10%, #1a1220 0%, transparent 60%), #08090c;
      color:#eef1f6; font-family:"Sora", system-ui, sans-serif; }
    .wrap { max-width: 520px; }
    .mark { font-size: 56px; color: var(--lime); }
    .kicker { font-family:"JetBrains Mono", monospace; font-size:11px; letter-spacing:0.24em; text-transform:uppercase; color:var(--lime); margin:18px 0 8px; }
    h1 { font-family:"Anton", sans-serif; font-size: clamp(44px, 12vw, 92px); line-height:0.94; text-transform:uppercase; margin:0 0 14px; }
    h1 em { color: var(--ember); font-style: normal; }
    p { color: var(--muted); font-size: 15px; margin: 0 0 26px; }
    a { display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:14.5px; padding:13px 24px; border-radius:999px;
      background: linear-gradient(180deg, var(--lime), #9bd321); color:#0a0c11; text-decoration:none; }
    .foot { margin-top:32px; font-family:"JetBrains Mono", monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#5d6577; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark" aria-hidden="true">◈</div>
    <p class="kicker">404</p>
    <h1>Wrong turn.<br /><em>Back to work.</em></h1>
    <p>That page does not exist. Your streak is still safe.</p>
    <a href="./">Open the dashboard</a>
    <p class="foot">DISCIPLINE</p>
  </div>
</body>
</html>
